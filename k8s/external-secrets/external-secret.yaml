# Syncs dev/crm/API_key from AWS Secrets Manager into a native k8s Secret
# (crm-api-key) in this app's namespace, via the shared aws-secrets-manager
# ClusterSecretStore. The Deployment reads it as a plain env var — the app
# itself never needs AWS credentials when running in-cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-manb-ms-crm-api-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: crm-api-key
    creationPolicy: Owner
  data:
    - secretKey: API_KEY
      remoteRef:
        key: dev/crm/API_key
        property: API_KEY
