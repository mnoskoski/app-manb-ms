# Cluster-wide AWS Secrets Manager store. One per cluster — any app's
# ExternalSecret references this by name, instead of every app carrying its
# own AWS credentials. Auth credentials live in the aws-secretsmanager-creds
# Secret (namespace external-secrets), scoped to the eso-dev-secrets-reader
# IAM user (secretsmanager:GetSecretValue/DescribeSecret on dev/* only).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-secretsmanager-creds
            namespace: external-secrets
            key: access-key
          secretAccessKeySecretRef:
            name: aws-secretsmanager-creds
            namespace: external-secrets
            key: secret-access-key
